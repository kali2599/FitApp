{% extends "base.html" %}
{% block title %}{{ 'Edit sport' if editing else 'New sport' }}{% endblock %}
{% block back %}
<a class="btn btn-outline-secondary btn-sm mb-3" href="{{ url_for('sports.index') }}">
  <i class="bi bi-arrow-left me-1"></i>All sports
</a>
{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card shadow-sm border-0">
      <div class="card-header d-flex justify-content-between align-items-center">
        <span class="fw-semibold">
          <i class="bi bi-lightning-charge-fill me-2"></i>{{ 'Edit sport' if editing else 'New sport' }}
        </span>
      </div>
      <div class="card-body">
        <form method="post" novalidate>
              <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label" for="name">Sport name *</label>
            <input class="form-control" id="name" name="name" type="text"
                   value="{{ sport['name'] or '' }}" placeholder="e.g. Calisthenics" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="notes">Notes</label>
            <textarea class="form-control" id="notes" name="notes" rows="2"
                      placeholder="Goal of the sport, schedule...">{{ sport['notes'] or '' }}</textarea>
          </div>
          <div class="d-flex gap-2">
            <button class="btn btn-success" type="submit">
              <i class="bi bi-check-lg me-1"></i>{{ 'Save changes' if editing else 'Create sport' }}
            </button>
            <a class="btn btn-outline-secondary" href="{{ url_for('sports.index') }}">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
