{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm auth-card">
      <div class="card-body p-4">
        <h1 class="h4 mb-3 text-center"><i class="bi bi-person-plus me-2"></i>Create your account</h1>
        <form method="post" novalidate>
              <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label" for="username">Username</label>
            <input class="form-control" id="username" name="username" type="text"
                   value="{{ form.get('username', '') }}" minlength="3" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" id="email" name="email" type="email"
                   value="{{ form.get('email', '') }}" required>
          </div>
          <div class="row">
            <div class="col mb-3">
              <label class="form-label" for="password">Password</label>
              <input class="form-control" id="password" name="password" type="password" minlength="6" required>
            </div>
            <div class="col mb-3">
              <label class="form-label" for="confirm">Confirm password</label>
              <input class="form-control" id="confirm" name="confirm" type="password" minlength="6" required>
            </div>
          </div>
          <button class="btn btn-success w-100" type="submit">Sign up</button>
        </form>
        <p class="small text-center mt-3 mb-0">
          Already registered? <a href="{{ url_for('auth.login') }}">Log in</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
