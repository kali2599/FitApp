{% extends "base.html" %}
{% block title %}Log {{ day['name'] }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card shadow-sm border-0">
      <div class="card-header d-flex justify-content-between align-items-center">
        <span class="fw-semibold"><i class="bi bi-check2-circle me-2"></i>Log "{{ day['name'] }}"</span>
        <a class="small" href="{{ url_for('workouts.detail', workout_id=workout['id']) }}">Back to workout</a>
      </div>
      <div class="card-body">
        <form method="post" novalidate>
          <div class="row">
            <div class="col-md-4 mb-3">
              <label class="form-label" for="performed_date">Date *</label>
              <input class="form-control" id="performed_date" name="performed_date" type="date"
                     value="{{ form.get('performed_date', today) }}" required>
            </div>
            <div class="col-md-4 mb-3">
              <label class="form-label" for="duration_min">Duration (min)</label>
              <input class="form-control" id="duration_min" name="duration_min" type="number"
                     min="0" max="1440" value="{{ form.get('duration_min', '') }}">
            </div>
            <div class="col-md-4 mb-3">
              <label class="form-label" for="calories">Calories burned</label>
              <input class="form-control" id="calories" name="calories" type="number"
                     min="0" step="1" value="{{ form.get('calories', '') }}">
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="notes">Notes</label>
            <input class="form-control" id="notes" name="notes" type="text"
                   value="{{ form.get('notes', '') }}" placeholder="How did it go?">
          </div>
          <p class="small text-muted">
            Your planned exercises will be copied into this session so you can record the actual
            reps, weight or duration afterwards.
          </p>
          <div class="d-flex gap-2">
            <button class="btn btn-success" type="submit"><i class="bi bi-check-lg me-1"></i>Log this module</button>
            <a class="btn btn-outline-secondary" href="{{ url_for('workouts.detail', workout_id=workout['id']) }}">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
